name: Synthetic baseline validator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-synthetic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Validate synthetic fresh-database baseline
        run: npm run test:baseline-validator
